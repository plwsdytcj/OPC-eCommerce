services:
  postgres:
    image: postgres:16-alpine
    container_name: opc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: opc
      POSTGRES_PASSWORD: opc
      POSTGRES_DB: opc
    ports:
      - "5432:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opc -d opc"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: opc-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./.data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: opc-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: opc
      MINIO_ROOT_PASSWORD: opcopcopc
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./.data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: opc-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 opc opcopcopc &&
      mc mb -p local/opc-artifacts || true &&
      echo 'MinIO bucket ready: opc-artifacts'
      "
